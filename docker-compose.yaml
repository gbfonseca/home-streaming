services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_DIR:-${HOME}/.local/share/home-streaming}/qbittorrent:/config
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Downloads:/downloads
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media-network

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002
    volumes:
      - ${CONFIG_DIR:-${HOME}/.local/share/home-streaming}/radarr:/config
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Filmes:/movies
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002
    volumes:
      - ${CONFIG_DIR:-${HOME}/.local/share/home-streaming}/sonarr:/config
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Series:/tv
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002
    volumes:
      - ${CONFIG_DIR:-${HOME}/.local/share/home-streaming}/bazarr:/config
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Filmes:/movies
      - ${MEDIA_DIR:-/mnt/d/Multimídia}/Series:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002
    volumes:
      - ${CONFIG_DIR:-${HOME}/.local/share/home-streaming}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Sao_Paulo
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - media-network

  # Jellyfin roda nativo no Windows (não no Docker) para usar a GPU AMD via AMF/D3D11VA.
  # Mantido comentado como referência / fallback sem aceleração por hardware.
  # jellyfin:
  #   image: lscr.io/linuxserver/jellyfin:latest
  #   container_name: jellyfin
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=America/Sao_Paulo
  #     - UMASK=002
  #   volumes:
  #     - ${CONFIG_DIR:-${HOME}/.local/share/home-streaming}/jellyfin:/config
  #     - ${MEDIA_DIR:-/mnt/d/Multimídia}/Series:/tv
  #     - ${MEDIA_DIR:-/mnt/d/Multimídia}/Filmes:/movies
  #   ports:
  #     - 8096:8096
  #   restart: unless-stopped
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   networks:
  #     - media-network

networks:
  media-network:
    name: media-network
    driver: bridge
